<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八字排盘 - Fortune Engine 测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .input-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      font-weight: bold;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .result-section {
      display: none;
    }

    .result-section.show {
      display: block;
    }

    .pillars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .pillar {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .pillar-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .pillar-chars {
      font-size: 36px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
      font-family: 'KaiTi', '楷体', serif;
    }

    .pillar-info {
      font-size: 12px;
      color: #888;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .info-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid #667eea;
    }

    .info-box h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .info-item {
      margin-bottom: 10px;
      padding: 8px;
      background: white;
      border-radius: 5px;
    }

    .info-item label {
      color: #666;
      font-size: 14px;
      margin-right: 10px;
    }

    .info-item span {
      color: #333;
      font-weight: bold;
    }

    .wuxing-chart {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
    }

    .wuxing-item {
      text-align: center;
    }

    .wuxing-bar {
      width: 40px;
      background: #e0e0e0;
      border-radius: 5px;
      overflow: hidden;
      height: 100px;
      position: relative;
      margin: 0 auto 10px;
    }

    .wuxing-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      transition: height 0.5s;
    }

    .wuxing-木 { background: #4caf50; }
    .wuxing-火 { background: #f44336; }
    .wuxing-土 { background: #ff9800; }
    .wuxing-金 { background: #ffc107; }
    .wuxing-水 { background: #2196f3; }

    .dayun-list {
      display: grid;
      gap: 10px;
    }

    .dayun-item {
      background: white;
      padding: 12px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #c62828;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #667eea;
    }

    @media (max-width: 768px) {
      .pillars {
        grid-template-columns: repeat(2, 1fr);
      }

      .header h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔮 八字排盘</h1>
      <p>基于传统命理学的精准排盘系统</p>
    </div>

    <div class="card">
      <div class="input-section">
        <div class="form-group">
          <label for="name">姓名</label>
          <input type="text" id="name" placeholder="请输入姓名（可选）" value="测试用户">
        </div>

        <div class="form-group">
          <label for="gender">性别</label>
          <select id="gender">
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>

        <div class="form-group">
          <label for="birthDate">出生日期</label>
          <input type="date" id="birthDate" value="1990-01-01">
        </div>

        <div class="form-group">
          <label for="birthTime">出生时间</label>
          <input type="time" id="birthTime" value="12:30">
        </div>

        <div class="form-group">
          <label for="longitude">经度（可选）</label>
          <input type="number" id="longitude" placeholder="如：116.4" step="0.1" value="120">
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="useTrueSolarTime">
          <label for="useTrueSolarTime">使用真太阳时</label>
        </div>
      </div>

      <button class="btn" onclick="calculate()">开始排盘</button>
    </div>

    <div id="error" class="error" style="display: none;"></div>
    <div id="loading" class="loading" style="display: none;">正在计算...</div>

    <div id="result" class="result-section">
      <!-- 四柱 -->
      <div class="card">
        <h2 style="margin-bottom: 20px; color: #333;">四柱八字</h2>
        <div class="pillars">
          <div class="pillar">
            <div class="pillar-label">年柱</div>
            <div class="pillar-chars" id="year-pillar">甲子</div>
            <div class="pillar-info" id="year-nayin">海中金</div>
          </div>
          <div class="pillar">
            <div class="pillar-label">月柱</div>
            <div class="pillar-chars" id="month-pillar">乙丑</div>
            <div class="pillar-info" id="month-nayin">海中金</div>
          </div>
          <div class="pillar">
            <div class="pillar-label">日柱（日主）</div>
            <div class="pillar-chars" id="day-pillar">丙寅</div>
            <div class="pillar-info" id="day-nayin">炉中火</div>
          </div>
          <div class="pillar">
            <div class="pillar-label">时柱</div>
            <div class="pillar-chars" id="hour-pillar">丁卯</div>
            <div class="pillar-info" id="hour-nayin">炉中火</div>
          </div>
        </div>
      </div>

      <!-- 基本信息 -->
      <div class="card">
        <div class="info-grid">
          <div class="info-box">
            <h3>📅 农历信息</h3>
            <div class="info-item">
              <label>农历：</label>
              <span id="lunar-date">己巳年 冬月初七</span>
            </div>
          </div>

          <div class="info-box">
            <h3>🔥 五行分析</h3>
            <div class="info-item">
              <label>日主五行：</label>
              <span id="day-master-wuxing">火</span>
            </div>
            <div class="info-item">
              <label>日主强弱：</label>
              <span id="day-master-strength">身旺</span>
            </div>
            <div class="wuxing-chart" id="wuxing-chart"></div>
          </div>

          <div class="info-box">
            <h3>🎯 用神分析</h3>
            <div class="info-item">
              <label>喜用神：</label>
              <span id="xiyongshen">官杀、食伤、财星</span>
            </div>
            <div class="info-item">
              <label>忌神：</label>
              <span id="jishen">印星、比劫</span>
            </div>
          </div>

          <div class="info-box">
            <h3>⚡ 十神分析</h3>
            <div class="info-item">
              <label>年柱：</label>
              <span id="year-shishen">正官</span>
            </div>
            <div class="info-item">
              <label>月柱：</label>
              <span id="month-shishen">偏财</span>
            </div>
            <div class="info-item">
              <label>日柱：</label>
              <span id="day-shishen">日主</span>
            </div>
            <div class="info-item">
              <label>时柱：</label>
              <span id="hour-shishen">食神</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 大运 -->
      <div class="card">
        <h2 style="margin-bottom: 20px; color: #333;">大运流年</h2>
        <div class="info-box">
          <h3>大运（每十年一步）</h3>
          <div class="dayun-list" id="dayun-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // 这里需要引入构建后的fortune-engine
    // 由于是静态HTML，我们需要先构建并导出

    async function loadEngine() {
      // 动态加载构建后的模块
      try {
        const module = await import('./dist/index.esm.js');
        return module;
      } catch (error) {
        console.error('加载模块失败:', error);
        throw new Error('请先运行 npm run build 构建模块');
      }
    }

    window.calculate = async function() {
      const errorDiv = document.getElementById('error');
      const loadingDiv = document.getElementById('loading');
      const resultDiv = document.getElementById('result');

      // 隐藏之前的结果和错误
      errorDiv.style.display = 'none';
      resultDiv.classList.remove('show');
      loadingDiv.style.display = 'block';

      try {
        // 获取输入
        const name = document.getElementById('name').value;
        const gender = document.getElementById('gender').value;
        const birthDate = document.getElementById('birthDate').value;
        const birthTime = document.getElementById('birthTime').value;
        const longitude = parseFloat(document.getElementById('longitude').value);
        const useTrueSolarTime = document.getElementById('useTrueSolarTime').checked;

        // 加载引擎
        const engine = await loadEngine();

        // 计算八字
        const result = engine.calculate({
          name,
          gender,
          birthDate,
          birthTime,
          options: {
            useTrueSolarTime,
            longitude: useTrueSolarTime ? longitude : undefined
          }
        });

        // 显示结果
        displayResult(result);

        loadingDiv.style.display = 'none';
        resultDiv.classList.add('show');

      } catch (error) {
        loadingDiv.style.display = 'none';
        errorDiv.textContent = '计算失败: ' + error.message;
        errorDiv.style.display = 'block';
        console.error(error);
      }
    };

    function displayResult(result) {
      // 四柱
      document.getElementById('year-pillar').textContent =
        result.pillars.year.gan + result.pillars.year.zhi;
      document.getElementById('month-pillar').textContent =
        result.pillars.month.gan + result.pillars.month.zhi;
      document.getElementById('day-pillar').textContent =
        result.pillars.day.gan + result.pillars.day.zhi;
      document.getElementById('hour-pillar').textContent =
        result.pillars.hour.gan + result.pillars.hour.zhi;

      // 纳音
      document.getElementById('year-nayin').textContent = result.nayin.year;
      document.getElementById('month-nayin').textContent = result.nayin.month;
      document.getElementById('day-nayin').textContent = result.nayin.day;
      document.getElementById('hour-nayin').textContent = result.nayin.hour;

      // 农历
      document.getElementById('lunar-date').textContent =
        `${result.lunar.yearName} ${result.lunar.monthName}${result.lunar.dayName}`;

      // 五行
      document.getElementById('day-master-wuxing').textContent = result.wuxing.dayMasterWuxing;
      document.getElementById('day-master-strength').textContent = result.wuxing.dayMasterStrength;

      // 五行图表
      const wuxingChart = document.getElementById('wuxing-chart');
      wuxingChart.innerHTML = '';
      const maxCount = Math.max(...Object.values(result.wuxing.count));
      ['木', '火', '土', '金', '水'].forEach(wx => {
        const count = result.wuxing.count[wx];
        const percentage = maxCount > 0 ? (count / maxCount) * 100 : 0;
        wuxingChart.innerHTML += `
          <div class="wuxing-item">
            <div class="wuxing-bar">
              <div class="wuxing-fill wuxing-${wx}" style="height: ${percentage}%"></div>
            </div>
            <div>${wx} ${count}</div>
          </div>
        `;
      });

      // 用神
      document.getElementById('xiyongshen').textContent = result.wuxing.xiyongshen;
      document.getElementById('jishen').textContent = result.wuxing.jishen;

      // 十神
      document.getElementById('year-shishen').textContent = result.shishen.year;
      document.getElementById('month-shishen').textContent = result.shishen.month;
      document.getElementById('day-shishen').textContent = result.shishen.day;
      document.getElementById('hour-shishen').textContent = result.shishen.hour;

      // 大运
      const dayunList = document.getElementById('dayun-list');
      dayunList.innerHTML = '';
      result.dayun.slice(0, 5).forEach(dy => {
        dayunList.innerHTML += `
          <div class="dayun-item">
            <span style="font-weight: bold; font-size: 18px;">${dy.gan}${dy.zhi}</span>
            <span>${dy.startAge}-${dy.endAge}岁</span>
            <span style="color: #666;">${dy.nayin}</span>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
